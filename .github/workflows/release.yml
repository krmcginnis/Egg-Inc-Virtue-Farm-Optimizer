name: Publish App Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json', '.github/workflows/release.yml', 'scripts/release*', 'tests/release*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run Windows checks without publishing a release'
        type: boolean
        default: false
concurrency:
  group: publish-app-release-v2
  cancel-in-progress: false
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  RELEASE_REPOSITORY: ${{ github.repository }}
jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      build: ${{ steps.intent.outputs.build }}
      publish: ${{ steps.intent.outputs.publish }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine release intent
        id: intent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: node scripts/release-state.cjs
      - uses: actions/setup-node@v4
        if: steps.intent.outputs.build == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.intent.outputs.build == 'true'
        with:
          python-version: '3.12'
      - name: Build the single release candidate
        if: steps.intent.outputs.build == 'true'
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/release-verify.py --candidate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: steps.intent.outputs.build == 'true'
        with:
          name: release-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            app.js
            worker-source.js
            Update-Files.json
            tmp/release/*
            tmp/release-candidate.json
  checks:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        group: [model, ui, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: .
      - name: Run every required check in this group
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release-checks.cjs --group ${{ matrix.group }} --ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-checks-${{ matrix.group }}
          retention-days: 14
          if-no-files-found: error
          path: tmp/release-checks-${{ matrix.group }}.json
  finalize:
    needs: [prepare, checks]
    if: needs.prepare.outputs.build == 'true' && needs.checks.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: release-checks-*
          merge-multiple: true
          path: tmp
      - name: Validate all groups against the tested candidate
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/release-acceptance.py --gate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish complete assets together
        if: needs.prepare.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This version already exists; assets are never replaced.' }
          gh release create "v$version" tmp/release/Egg-Inc-Virtue-Farm-Optimizer.zip tmp/release/update-manifest.json --target $env:GITHUB_SHA --title "Egg Inc. Virtue Farm Optimizer v$version" --notes-file RELEASE-NOTES.md --draft
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify public download and browser; record acceptance
        if: needs.prepare.outputs.publish == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.prepare.outputs.version }}'
          try {
            & ./scripts/release-feed.ps1
            if ($LASTEXITCODE) { throw 'Native public updater feed verification failed.' }
            python scripts/release-verify.py --public --expected-version $version --expected-commit $env:GITHUB_SHA --extract tmp/public-app
            if ($LASTEXITCODE) { throw 'Anonymous public release verification failed.' }
            node tests/release-browser.cjs --app-root tmp/public-app/Egg-Inc-Virtue-Farm-Optimizer --report tmp/public-browser.json
            if ($LASTEXITCODE) { throw 'Public release browser verification failed.' }
            python scripts/release-acceptance.py --accept
            if ($LASTEXITCODE) { throw 'Acceptance evidence validation failed.' }
          } catch {
            gh release edit "v$version" --draft=true
            throw "Public release checks failed; the new release was hidden. $($_.Exception.Message)"
          }
      - name: Exercise public verification without publishing
        if: needs.prepare.outputs.publish != 'true'
        shell: pwsh
        run: |
          python scripts/release-verify.py --current-public
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/release-acceptance.py --verify-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record accepted evidence in source if main is unchanged
        if: needs.prepare.outputs.publish == 'true'
        run: node scripts/release-record.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          retention-days: 90
          if-no-files-found: error
          path: |
            tmp/release-validation.json
            tmp/public-verification.json
            tmp/public-browser.json
            tmp/release-checks-*.json
